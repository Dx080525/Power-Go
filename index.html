<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 Power Go 🌟</title>
    <style>
        /* ==================== 👑 纯视觉大厂高档特效 👑 ==================== */
        /* SSR卡牌的璀璨金边 */
        .g-SSR {
            border: 3px solid #fbbf24 !important;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.6) !important;
        }

        /* UR卡牌专属：终极神话金色流光 */
        .g-UR {
            border: 3px solid #eab308 !important;
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.9), inset 0 0 15px rgba(234, 179, 8, 0.5) !important;
            animation: urGlow 1.5s infinite alternate ease-in-out !important;
        }

        @keyframes urGlow {
            0% { transform: scale(1); filter: brightness(1) drop-shadow(0 0 5px #eab308); }
            100% { transform: scale(1.02); filter: brightness(1.25) drop-shadow(0 0 15px #eab308); }
        }

        /* 全屏震动特效 */
        .screen-shake {
            animation: shakeEffect 0.4s cubic-bezier(.36,.07,.19,.97) both !important;
        }

        @keyframes shakeEffect {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
        /* ================================================================= */

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #4b5161;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            overflow-x: hidden;
        }

        .title {
            font-size: 42px;
            font-weight: bold;
            color: #26e6e6;
            text-shadow: 0 0 15px rgba(38,230,230,0.6);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .asset-panel {
            background: linear-gradient(135deg, #757261, #615d47);
            border: 2px solid #a39758;
            border-radius: 15px;
            padding: 12px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .main-layout {
            display: flex;
            gap: 30px;
            width: 100%;
            max-width: 1100px;
            align-items: flex-start;
        }

        .control-panel {
            background-color: #2c3242;
            border: 2px solid #434b5e;
            border-radius: 20px;
            padding: 25px;
            flex: 1.3;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .panel-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 5px solid #26e6e6;
            padding-left: 10px;
        }

        .panel-title.pink {
            border-left-color: #ff6699;
        }

        .btn-group {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .action-btn {
            flex: 1;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .action-btn:active { transform: scale(0.97); }
        .btn-single { background: linear-gradient(180deg, #00bfff, #007acc); border-bottom: 4px solid #005999; }
        .btn-ten { background: linear-gradient(180deg, #ff7f50, #ff4500); border-bottom: 4px solid #cc3300; }
        .btn-sell-all { background: linear-gradient(180deg, #ff66a3, #ff3385); border-bottom: 4px solid #cc0066; width: 100%; margin-top: 20px; }

        .rate-box {
            background-color: #1a1e29;
            border-radius: 12px;
            padding: 15px;
            font-size: 15px;
            line-height: 1.8;
            border: 1px solid #333b4d;
            margin-bottom: 25px;
        }

        .rate-title { color: #26e6e6; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }

        .inventory-panel {
            background-color: #2c3242;
            border: 2px solid #434b5e;
            border-radius: 20px;
            padding: 25px;
            flex: 1;
            min-height: 400px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
        }

        .list-title {
            font-size: 18px;
            color: #a0aab8;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: flex-start;
        }

        .inventory-scroll {
            flex: 1;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* 卡片挂载基础样式 */
        .bag-item {
            background-color: #1f2430;
            border: 1px solid #3d4659;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .bag-item-left { display: flex; align-items: center; gap: 12px; }
        .bag-item-img { width: 45px; height: 45px; object-fit: contain; background: #11141c; border-radius: 8px; padding: 2px; }
        .bag-item-info strong { font-size: 15px; color: #fff; }
        .bag-item-info span { font-size: 13px; font-weight: bold; }

        .sell-btn {
            background-color: #e64545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .sell-btn:hover { background-color: #cc3434; }

        .empty {
            color: #64748b;
            text-align: center;
            font-style: italic;
            padding: 40px 0;
            width: 100%;
        }

        /* 纯正全屏大透视抽卡弹窗 */
        #showcardOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 13, 20, 0.92);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            backdrop-filter: blur(10px);
        }

        .giant-card {
            width: 310px;
            height: 450px;
            background: #1f2533;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border: 2px solid #47536e;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            transform: scale(0.8);
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .giant-card.pop-up { transform: scale(1); opacity: 1; }
        .giant-rarity { font-size: 26px; font-weight: bold; font-style: italic; align-self: flex-start; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .giant-card img { width: 100%; height: 74%; object-fit: contain; border-radius: 10px; background: #131722; padding: 5px; }
        .giant-name { font-size: 20px; font-weight: bold; text-align: center; color: #fff; }

        .next-btn {
            padding: 12px 40px;
            font-size: 16px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(34,197,94,0.4);
        }
        .next-btn:hover { background: #16a34a; }
    </style>
</head>
<body>

    <div class="title">✨ Power Go ✨</div>

    <div class="asset-panel">
        💰 总金币资产: <span id="gold">5000</span>
    </div>

    <div class="main-layout">
        <div class="control-panel">
            <div class="panel-title">🎴 钛金抽卡控制大厅</div>
            
            <div class="btn-group">
                <button class="action-btn btn-single" onclick="draw(1)">单抽 (100金币)</button>
                <button class="action-btn btn-ten" onclick="draw(10)">十连抽 (1000金币)</button>
            </div>

            <div class="rate-box">
                <div class="rate-title">📢 概率公示</div>
                <div>N 普通: 60%（出售 10 金币）</div>
                <div>R 稀有: 25%（出售 80 金币）</div>
                <div>SR 超稀有: 12%（出售 800 金币）</div>
                <div style="color: #fbbf24; font-weight: bold;">SSR 传说: 2.7%（出售 3500 金币）</div>
                <div style="color: #eab308; font-weight: bold;">UR 神话: 0.3%（出售 9999 金币）</div>
            </div>

            <div class="list-title">✨ 本轮所得卡牌清单</div>
            <div id="result-grid" class="grid-container">
                <div class="empty">暂无精灵</div>
            </div>
        </div>

        <div class="inventory-panel">
            <div class="panel-title pink">🎒 精灵核心核心仓库</div>
            <div class="inventory-scroll">
                <div id="inventory" class="grid-container">
                    <div class="empty">暂无精灵</div>
                </div>
            </div>
            <button class="action-btn btn-sell-all" onclick="sellAll()">一键出售全部</button>
        </div>
    </div>

    <div id="showcardOverlay">
        <div id="giantCard" class="giant-card"></div>
        <button id="nextCardBtn" class="next-btn" onclick="showNextCardInQueue()">下一张</button>
    </div>

<script>
    // 价格体系
    const prices = { "N": 10, "R": 80, "SR": 800, "SSR": 3500, "UR": 9999 };

    // 🌟 全套 30 只正版卡池数据
    const monsters = [
        { name: "妙蛙种子", rarity: "N", image: "https://asia.pokemon-card.com/hk/card-img/hk00008867.png" },
        { name: "小火龙", rarity: "N", image: "https://asia.pokemon-card.com/hk/card-img/hk00004944.png" },
        { name: "杰尼龟", rarity: "N", image: "https://asia.pokemon-card.com/hk/card-img/hk00004953.png" },
        { name: "绿毛虫", rarity: "N", image: "https://asia.pokemon-card.com/hk/card-img/hk00008064.png" },
        { name: "波波", rarity: "N", image: "https://asia.pokemon-card.com/hk/card-img/hk00008272.png" },
        { name: "可达鸭", rarity: "N", image: "https://asia.pokemon-card.com/hk/card-img/hk00006323.png" },
        { name: "呆呆兽", rarity: "N", image: "https://asia.pokemon-card.com/hk/card-img/hk00003010.png" },
        { name: "小磁怪", rarity: "N", image: "https://asia.pokemon-card.com/hk/card-img/hk00006361.png" },
        { name: "地鼠", rarity: "N", image: "https://asia.pokemon-card.com/hk/card-img/hk00003039.png" },

        { name: "比雕 (大比鸟)", rarity: "R", image: "https://asia.pokemon-card.com/hk/card-img/hk00003243.png" },
        { name: "大针蜂", rarity: "R", image: "https://asia.pokemon-card.com/tw/card-img/tw00018423.png" },
        { name: "胖丁", rarity: "R", image: "https://asia.pokemon-card.com/hk/card-img/hk00003028.png" },
        { name: "九尾", rarity: "R", image: "https://asia.pokemon-card.com/hk/card-img/hk00004948.png" },
        { name: "风速狗", rarity: "R", image: "https://asia.pokemon-card.com/hk/card-img/hk00003213.png" },
        { name: "耿鬼", rarity: "R", image: "https://asia.pokemon-card.com/hk/card-img/hk00003222.png" },
        { name: "暴鲤龙", rarity: "R", image: "https://asia.pokemon-card.com/hk/card-img/hk00004961.png" },
        { name: "卡比兽", rarity: "R", image: "https://asia.pokemon-card.com/hk/card-img/hk00006450.png" },

        { name: "快龙 ex", rarity: "SR", image: "https://asia.pokemon-card.com/hk/card-img/hk00007886.png" },
        { name: "巨金怪 ex", rarity: "SR", image: "https://asia.pokemon-card.com/hk/card-img/hk00007890.png" },
        { name: "轰鸣月 ex", rarity: "SR", image: "https://asia.pokemon-card.com/hk/card-img/hk00007662.png" },
        { name: "铁武者 ex", rarity: "SR", image: "https://asia.pokemon-card.com/hk/card-img/hk00007641.png" },
        { name: "班基拉斯 ex", rarity: "SR", image: "https://asia.pokemon-card.com/hk/card-img/hk00007135.png" },
        { name: "赛富豪 ex", rarity: "SR", image: "https://asia.pokemon-card.com/hk/card-img/hk00004245.png" },

        { name: "喷火龙 ex", rarity: "SSR", image: "https://q7.itc.cn/images01/20211028/5ebb6de3597743ef9dda4adb8a27406b.png" },
        { name: "皮卡丘 ex", rarity: "SSR", image: "https://asia.pokemon-card.com/tw/card-img/tw00018367.png" },
        { name: "甲贺忍蛙 ex", rarity: "SSR", image: "https://asia.pokemon-card.com/hk/card-img/hk00008518.png" },
        { name: "超梦 ex", rarity: "SSR", image: "https://asia.pokemon-card.com/hk/card-img/hk00008119.png" },
        { name: "烈空坐", rarity: "SSR", image: "https://asia.pokemon-card.com/hk/card-img/hk00004381.png" },

        { name: "金色·阿尔宙斯 VSTAR", rarity: "UR", image: "https://asia.pokemon-card.com/tw/card-img/tw00047244.png" },
        { name: "金色·骑拉帝纳 VSTAR", rarity: "UR", image: "https://asia.pokemon-card.com/tw/card-img/tw00006201.png" }
    ];

    let gold = localStorage.getItem("pg_gold") !== null ? parseInt(localStorage.getItem("pg_gold")) : 5000;
    let inventory = localStorage.getItem("pg_inventory") !== null ? JSON.parse(localStorage.getItem("pg_inventory")) : [];
    let latestDrawResult = [];
    let cardQueue = [];
    let currentQueueIndex = 0;

    window.onload = function() {
        updateGold();
        renderInventory();
    };

    function updateGold() {
        document.getElementById("gold").innerText = gold;
    }

    function draw(times) {
        const cost = times * 100;
        if (gold < cost) {
            alert("🪙 金币不足，快去出售旧卡牌换取金币吧！");
            return;
        }

        gold -= cost;
        updateGold();

        latestDrawResult = [];
        cardQueue = [];

        for (let i = 0; i < times; i++) {
            let roll = Math.random() * 100;
            let selectedRarity = "N";

            if (roll < 0.3) selectedRarity = "UR";
            else if (roll < 3.0) selectedRarity = "SSR";
            else if (roll < 15.0) selectedRarity = "SR";
            else if (roll < 40.0) selectedRarity = "R";
            else selectedRarity = "N";

            let pool = monsters.filter(m => m.rarity === selectedRarity);
            let rolledMonster = pool[Math.floor(Math.random() * pool.length)];

            latestDrawResult.push(rolledMonster);
            cardQueue.push(rolledMonster);
            inventory.push({ ...rolledMonster, sell: prices[rolledMonster.rarity] });
        }

        currentQueueIndex = 0;
        document.getElementById("showcardOverlay").style.display = "flex";
        showNextCardInQueue();
    }

    function showNextCardInQueue() {
        const giantCard = document.getElementById("giantCard");
        const stage = document.getElementById("showcardOverlay");

        giantCard.classList.remove("pop-up");

        if (currentQueueIndex >= cardQueue.length) {
            stage.style.display = "none";
            renderBottomResultGrid();
            renderInventory();
            saveDataToStorage();
            return;
        }

        const monster = cardQueue[currentQueueIndex];
        const btn = document.getElementById("nextCardBtn");

        if (currentQueueIndex === cardQueue.length - 1) {
            btn.innerText = "收入核心核心仓库 🎒";
        } else {
            btn.innerText = `下一张 (${currentQueueIndex + 1}/${cardQueue.length}) ➡️`;
        }

        setTimeout(() => {
            giantCard.className = `giant-card g-${monster.rarity}`;
            giantCard.innerHTML = `
                <div class="giant-rarity" style="color:${monster.rarity === 'UR'?'#eab308':(monster.rarity === 'SSR'?'#fbbf24':'#fff')}">${monster.rarity}</div>
                <img src="${monster.image}">
                <div class="giant-name">${monster.name}</div>
            `;

            giantCard.classList.add("pop-up");
            currentQueueIndex++;

            applyHighEndEffects(monster.rarity);

        }, 150);
    }

    function renderBottomResultGrid() {
        const grid = document.getElementById("result-grid");
        if (latestDrawResult.length === 0) {
            grid.innerHTML = `<div class="empty">暂无精灵</div>`;
            return;
        }
        grid.innerHTML = "";
        latestDrawResult.forEach(monster => {
            const item = document.createElement("div");
            item.className = `bag-item g-${monster.rarity}`;
            item.innerHTML = `
                <div class="bag-item-left">
                    <img class="bag-item-img" src="${monster.image}">
                    <div class="bag-item-info">
                        <strong>${monster.name}</strong><br>
                        <span style="color:${monster.rarity === 'UR'?'#eab308':(monster.rarity === 'SSR'?'#fbbf24':'#fff')}">${monster.rarity}</span>
                    </div>
                </div>
            `;
            grid.appendChild(item);
        });
    }

    function renderInventory() {
        const container = document.getElementById("inventory");
        if (inventory.length === 0) {
            container.innerHTML = `<div class="empty">暂无精灵</div>`;
            return;
        }
        container.innerHTML = "";
        inventory.forEach((monster, index) => {
            const item = document.createElement("div");
            item.className = `bag-item g-${monster.rarity}`;
            item.innerHTML = `
                <div class="bag-item-left">
                    <img class="bag-item-img" src="${monster.image}">
                    <div class="bag-item-info">
                        <strong>${monster.name}</strong><br>
                        <span style="color:${monster.rarity === 'UR'?'#eab308':(monster.rarity === 'SSR'?'#fbbf24':'#fff')}">(${monster.rarity})</span>
                    </div>
                </div>
                <button class="sell-btn" onclick="sellOne(${index})">出售 +${monster.sell}</button>
            `;
            container.appendChild(item);
        });
    }

    function sellOne(index) {
        gold += inventory[index].sell;
        inventory.splice(index, 1);
        updateGold();
        renderInventory();
        saveDataToStorage();
    }

    function sellAll() {
        if (inventory.length === 0) {
            alert("🎒 仓库空空如也，没什么可卖的！");
            return;
        }
        let totalGain = 0;
        inventory.forEach(monster => {
            totalGain += monster.sell;
        });
        gold += totalGain;
        inventory = [];
        updateGold();
        renderInventory();
        saveDataToStorage();
        alert(`💰 成功清空仓库！一键换取了 ${totalGain} 金币！`);
    }

    function saveDataToStorage() {
        localStorage.setItem("pg_gold", gold);
        localStorage.setItem("pg_inventory", JSON.stringify(inventory));
    }

    function applyHighEndEffects(rarity) {
        document.body.classList.remove("screen-shake");

        if (rarity === "UR") {
            setTimeout(() => document.body.classList.add("screen-shake"), 5);
            
            let urBanner = document.createElement("div");
            urBanner.innerHTML = "✨ 👑 究极神话 UR 诞生 👑 ✨";
            urBanner.style = "position:fixed; top:15%; left:50%; transform:translate(-50%,-50%); color:#eab308; font-size:42px; font-weight:bold; text-shadow:0 0 25px #eab308, 0 0 5px #fff; z-index:99999; text-align:center; width:100%; pointer-events:none; font-family:'Microsoft YaHei',sans-serif;";
            document.body.appendChild(urBanner);
            
            setTimeout(() => { urBanner.remove(); document.body.classList.remove("screen-shake"); }, 2500);
        } 
        else if (rarity === "SSR") {
            let ssrBanner = document.createElement("div");
            ssrBanner.innerHTML = "🌟 传说级 SSR 出货 🌟";
            ssrBanner.style = "position:fixed; top:15%; left:50%; transform:translate(-50%,-50%); color:#fbbf24; font-size:32px; font-weight:bold; text-shadow:0 0 15px #fbbf24; z-index:99999; text-align:center; width:100%; pointer-events:none; font-family:'Microsoft YaHei',sans-serif;";
            document.body.appendChild(ssrBanner);
            setTimeout(() => ssrBanner.remove(), 2000);
        }
    }
</script>
</body>
</html>
