<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌟 Power Go Premium 4.7 爆率+回收双控商用版 🌟</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ==================== 🎨 核心 UI 样式表 ==================== */
        :root {
            --color-ur: #ff3e3e; --color-ssr: #ffa500; --color-sr: #a020f0; --color-r: #00c0ff; --color-n: #aaaaaa;
        }
        body {
            margin: 0; background: #0b0e14; color: #f5f6f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #121620; border-bottom: 1px solid #1e2538; position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 22px; font-weight: 900; background: linear-gradient(90deg, #00dbde, #fc00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-badge { background: linear-gradient(135deg, #ffd700, #ffa500); color: #000; padding: 6px 14px; border-radius: 20px; font-weight: bold; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px rgba(255,165,0,0.3); }
        .search-box { padding: 10px 20px; background: #121620; }
        .search-inner { position: relative; }
        .search-inner i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #64748b; }
        .search-inner input { width: 100%; box-sizing: border-box; padding: 10px 12px 10px 38px; background: #1e2538; border: 1px solid #2d3748; border-radius: 8px; color: #fff; font-size: 14px; }
        .tabs-bar { display: flex; gap: 10px; padding: 10px 20px; overflow-x: auto; white-space: nowrap; }
        .tab-btn { padding: 6px 16px; background: #1e2538; border: 1px solid #2d3748; border-radius: 20px; color: #94a3b8; font-size: 13px; cursor: pointer; }
        .tab-btn.active { background: #00dbde; color: #000; font-weight: bold; border-color: #00dbde; }
        .section-title { padding: 15px 20px 5px; font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 15px 20px; }
        .pack-card { background: #1e2538; border: 1px solid #2d3748; border-radius: 12px; overflow: hidden; position: relative; transition: transform 0.2s; }
        .pack-card:active { transform: scale(0.97); }
        .pack-banner { width: 100%; height: 100px; object-fit: cover; background: #2d3748; }
        .pack-info { padding: 10px; }
        .pack-title { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
        .pack-cost { font-size: 12px; color: #ffd700; display: flex; align-items: center; gap: 4px; }
        .pack-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 10px 10px; }
        .draw-btn { padding: 8px 0; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; color: #fff; background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .draw-btn.btn-10 { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
        
        /* 仓库样式 */
        .warehouse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 10px; padding: 15px 20px; }
        .bag-item { background: #161b26; border: 1px solid #2d3748; border-radius: 8px; padding: 8px; text-align: center; position: relative; }
        .bag-item img { width: 100%; height: 80px; object-fit: contain; border-radius: 4px; background: #1e2538; }
        .bag-name { font-size: 11px; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bag-rarity { font-size: 10px; font-weight: bold; margin-top: 2px; }
        .bag-price { font-size: 10px; color: #ffd700; margin-top: 3px; }
        .recycle-btn { margin-top: 6px; width: 100%; padding: 4px 0; font-size: 10px; border: none; background: #ef4444; color: #fff; border-radius: 4px; cursor: pointer; }
        .empty-tips { grid-column: 1/-1; text-align: center; color: #64748b; padding: 4px 0; font-size: 14px; margin: 40px auto; }
        
        /* 稀有度边框及文字色 */
        .border-UR { border-color: var(--color-ur) !important; box-shadow: inset 0 0 10px rgba(255,62,62,0.3); }
        .border-SSR { border-color: var(--color-ssr) !important; box-shadow: inset 0 0 10px rgba(255,165,0,0.3); }
        .border-SR { border-color: var(--color-sr) !important; box-shadow: inset 0 0 10px rgba(160,32,240,0.3); }
        .border-R { border-color: var(--color-r) !important; box-shadow: inset 0 0 10px rgba(0,192,255,0.3); }
        .border-N { border-color: var(--color-n) !important; }
        .text-UR { color: var(--color-ur); } .text-SSR { color: var(--color-ssr); } .text-SR { color: var(--color-sr); } .text-R { color: var(--color-r); } .text-N { color: var(--color-n); }

        /* 弹窗遮罩 */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,7,12,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .giant-card { width: 260px; height: 380px; background: #1e2538; border: 3px solid #2d3748; border-radius: 16px; box-shadow: 0 0 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; position: relative; }
        .giant-card img { width: 100%; height: 70%; object-fit: contain; background: #121620; border-radius: 8px; }
        .giant-info { margin-top: 15px; text-align: center; }
        .giant-rarity { font-size: 18px; font-weight: 900; italic; margin-bottom: 5px; }
        .giant-name { font-size: 16px; font-weight: bold; }
        .overlay-actions { margin-top: 30px; width: 260px; }
        .next-btn { width: 100%; padding: 12px 0; border: none; border-radius: 8px; background: #fff; color: #000; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,255,255,0.2); }
        
        /* 管理后台部分 */
        .admin-panel { padding: 15px 20px 80px; }
        .admin-section { background: #121620; border: 1px solid #1e2538; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .admin-section-title { font-size: 14px; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; color: #00dbde; }
        .admin-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .form-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 12px; color: #94a3b8; }
        .form-control { background: #1e2538; border: 1px solid #2d3748; border-radius: 6px; padding: 8px; color: #fff; font-size: 13px; }
        .pack-selector { width: 100%; background: #1e2538; border: 1px solid #2d3748; border-radius: 6px; padding: 8px; color: #fff; margin-bottom: 10px; }
        .admin-btn { width: 100%; padding: 10px 0; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; color: #fff; cursor: pointer; margin-top: 5px; }
        
        /* 底部导航 */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #121620; border-top: 1px solid #1e2538; display: flex; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #64748b; font-size: 11px; gap: 4px; cursor: pointer; }
        .nav-item.active { color: #00dbde; }
        .nav-item i { font-size: 18px; }
        
        /* 动画控制 */
        .pop-up { animation: cardPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes cardPop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">POWER GO 4.7</div>
        <div class="gold-badge">
            <i class="fas fa-coins"></i> <span id="goldVal">5000</span>
        </div>
    </div>

    <div id="page-market" class="game-page">
        <div class="tabs-bar" id="ipTabsContainer">
            <div class="tab-btn active" onclick="switchIPFilter('all', this)">全部IP</div>
            <div class="tab-btn" onclick="switchIPFilter('宝可梦', this)">宝可梦</div>
            <div class="tab-btn" onclick="switchIPFilter('海贼王', this)">海贼王</div>
            <div class="tab-btn" onclick="switchIPFilter('火影忍者', this)">火影忍者</div>
            <div class="tab-btn" onclick="switchIPFilter('鬼灭之刃', this)">鬼灭之刃</div>
        </div>
        <div class="section-title"><i class="fas fa-fire" style="color:#ff4500;"></i> 热门推荐限定卡包</div>
        <div class="market-grid" id="marketGridContainer"></div>
    </div>

    <div id="page-warehouse" class="game-page" style="display: none;">
        <div class="search-box">
            <div class="search-inner">
                <i class="fas fa-search"></i>
                <input type="text" id="globalSearchInput" placeholder="搜索商品、卡包、卡片名称..." oninput="renderWarehouseView()">
            </div>
        </div>
        <div class="admin-row" style="padding: 5px 20px 0;">
            <button class="admin-btn" style="background:#ef4444; margin:0;" onclick="sellAllWarehouse()">🎒 一键全部回收清空</button>
        </div>
        <div class="warehouse-grid" id="warehouseGridContainer"></div>
    </div>

    <div id="page-admin" class="game-page" style="display: none;">
        <div class="admin-panel">
            <div class="admin-section">
                <div class="admin-section-title">🪙 资方资产重置管理</div>
                <div class="admin-row">
                    <div class="form-group">
                        <label>充值金币数量</label>
                        <input type="number" id="gmGoldIn" class="form-control" value="5000">
                    </div>
                </div>
                <button class="admin-btn" style="background:linear-gradient(135deg, #0575e6, #021b79);" onclick="saveGmGold()">确认修改资产</button>
            </div>

            <div class="admin-section">
                <div class="admin-section-title">📊 全局抽卡爆率精密调配</div>
                <p style="color:#64748b; font-size:11px; margin-bottom:10px;">请确保五项概率相加【严格等于 100%】，否则会导致算法区间错乱！</p>
                <div class="admin-row">
                    <div class="form-group"><label>N 概率 (%)</label><input type="number" id="rateN" class="form-control" step="0.1"></div>
                    <div class="form-group"><label>R 概率 (%)</label><input type="number" id="rateR" class="form-control" step="0.1"></div>
                    <div class="form-group"><label>SR 概率 (%)</label><input type="number" id="rateSR" class="form-control" step="0.1"></div>
                </div>
                <div class="admin-row">
                    <div class="form-group"><label>SSR 概率 (%)</label><input type="number" id="rateSSR" class="form-control" step="0.1"></div>
                    <div class="form-group"><label>UR 概率 (%)</label><input type="number" id="rateUR" class="form-control" step="0.1"></div>
                </div>
                <button class="admin-btn" style="background:linear-gradient(135deg, #3b82f6, #1d4ed8);" onclick="saveCustomRates()">保存全局爆率配置</button>
            </div>

            <div class="admin-section">
                <div class="admin-section-title">🗺️ 卡包封面与参数可视化配置</div>
                <label style="font-size:12px; color:#94a3b8;">选择要修改的卡包系列</label>
                <select id="adminPackSelect" class="pack-selector" onchange="loadPackToAdminForm()"></select>
                <div class="form-group" style="margin-bottom:10px;">
                    <label>卡包名称</label>
                    <input type="text" id="adminPackTitle" class="form-control">
                </div>
                <div class="form-group" style="margin-bottom:10px;">
                    <label>卡包封面图片路径 (Banner URL)</label>
                    <input type="text" id="adminPackBanner" class="form-control">
                </div>
                <div class="form-group" style="margin-bottom:10px;">
                    <label>单抽消耗金币</label>
                    <input type="number" id="adminPackCost" class="form-control">
                </div>
                <button class="admin-btn" style="background:linear-gradient(135deg, #10b981, #059669);" onclick="savePackBasicConfig()">💾 保存此卡包基本参数</button>
                
                <hr style="border:0; border-top:1px solid #1e2538; margin:15px 0;">
                <div style="font-size:12px; font-weight:bold; margin-bottom:8px; color:#ffd700;">✨ 当前卡包独立卡池预览/追填</div>
                <div id="adminPoolPreview" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; max-height:120px; overflow-y:auto; background:#161b26; padding:8px; border-radius:6px;"></div>
                
                <div class="admin-row">
                    <div class="form-group"><label>新增单卡名称</label><input type="text" id="newCardName" class="form-control" placeholder="如：路飞五档"></div>
                    <div class="form-group">
                        <label>稀有度</label>
                        <select id="newCardRarity" class="form-control">
                            <option value="N">N</option><option value="R">R</option><option value="SR">SR</option><option value="SSR">SSR</option><option value="UR">UR</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom:10px;">
                    <label>单卡图片路径</label>
                    <input type="text" id="newCardImage" class="form-control" placeholder="留空则使用默认占位图">
                </div>
                <button class="admin-btn" style="background:#7c3aed;" onclick="addNewCardToPool()">➕ 注入新单卡入池</button>
            </div>
        </div>
    </div>

    <div id="showcardOverlay" class="overlay">
        <div id="giantCard" class="giant-card">
            <img id="giantImg" src="" alt="卡片立绘">
            <div class="giant-info">
                <div id="giantRarity" class="giant-rarity">UR</div>
                <div id="giantName" class="giant-name">测试卡片</div>
            </div>
        </div>
        <div class="overlay-actions">
            <button id="nextCardBtn" class="next-btn" onclick="triggerNextQueuedCard()">下一张 (1/10)</button>
        </div>
    </div>

    <canvas id="fxCanvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999; display: none;"></canvas>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchPage('market', this)"><i class="fas fa-bolt"></i><span>潮玩</span></div>
        <div class="nav-item" onclick="switchPage('warehouse', this)"><i class="fas fa-box"></i><span>仓库</span></div>
        <div class="nav-item" onclick="switchPage('admin', this)"><i class="fas fa-sliders-h"></i><span>高级后台</span></div>
    </div>

    <script>
        // 1. 初始化标准商用卡包及基础卡池数据配置矩阵
        const DEFAULT_PACKS_CONFIG = [
            {
                id: "pk_pokemon",
                title: "宝可梦：世代传说珍藏弹",
                tag: "宝可梦",
                banner: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500&q=80",
                cost: 100,
                pool: [
                    { name: "极巨化喷火龙", rarity: "UR", image: "https://images.unsplash.com/photo-1613771404724-17c245a03452?w=300&q=80" },
                    { name: "甲贺忍蛙", rarity: "SSR", image: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=300&q=80" },
                    { name: "皮卡丘", rarity: "SR", image: "https://images.unsplash.com/photo-1615111784767-4d7c0269435b?w=300&q=80" },
                    { name: "伊布", rarity: "R", image: "" },
                    { name: "小火龙", rarity: "N", image: "" }
                ]
            },
            {
                id: "pk_onepiece",
                title: "海贼王：新世界极意霸气弹",
                tag: "海贼王",
                banner: "https://images.unsplash.com/photo-1560169897-fc0cdbdfa4d5?w=500&q=80",
                cost: 150,
                pool: [
                    { name: "路飞·五档太阳神", rarity: "UR", image: "" },
                    { name: "索隆·阿修罗九刀流", rarity: "SSR", image: "" },
                    { name: "香克斯", rarity: "SR", image: "" },
                    { name: "艾斯", rarity: "R", image: "" },
                    { name: "巴基", rarity: "N", image: "" }
                ]
            },
            {
                id: "pk_naruto",
                title: "火影忍者：疾风传羁绊永恒弹",
                tag: "火影忍者",
                banner: "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500&q=80",
                cost: 120,
                pool: [
                    { name: "宇智波斑·六道仙人", rarity: "UR", image: "" },
                    { name: "漩涡鸣人·九喇嘛模式", rarity: "SSR", image: "" },
                    { name: "宇智波佐助", rarity: "SR", image: "" },
                    { name: "旗木卡卡西", rarity: "R", image: "" },
                    { name: "漩涡博人", rarity: "N", image: "" }
                ]
            },
            {
                id: "pk_kimetsu",
                title: "鬼灭之刃：无限城决战终章弹",
                tag: "鬼灭之刃",
                banner: "https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?w=500&q=80",
                cost: 100,
                pool: [
                    { name: "继国缘壹·日之呼吸", rarity: "UR", image: "" },
                    { name: "灶门炭治郎·火之神神乐", rarity: "SSR", image: "" },
                    { name: "炼狱杏寿郎", rarity: "SR", image: "" },
                    { name: "嘴平伊之助", rarity: "R", image: "" },
                    { name: "村田", rarity: "N", image: "" }
                ]
            }
        ];

        // 2. 动态加载持久化核心资产变量
        let PACKS_CONFIG = JSON.parse(localStorage.getItem("pg_packs_4")) || DEFAULT_PACKS_CONFIG;
        let gold = parseInt(localStorage.getItem("pg_gold_4")) || 5000;
        let warehouse = JSON.parse(localStorage.getItem("pg_warehouse_4") || "[]");

        // 3. 动态回收价格核心控制与爆率加载
        const DEFAULT_RECOVER_PRICES = { "N": 10, "R": 50, "SR": 200, "SSR": 800, "UR": 3000 };
        let recoverPrices = localStorage.getItem("pg_recover_prices") !== null ? JSON.parse(localStorage.getItem("pg_recover_prices")) : DEFAULT_RECOVER_PRICES;

        const DEFAULT_RATES = { "UR": 0.001, "SSR": 0.5, "SR": 2.499, "R": 12.0, "N": 85.0 };
        let RATES = { "UR": 0.001, "SSR": 0.5, "SR": 2.499, "R": 12.0, "N": 85.0 };

        let viewQueue = [];
        let queueIdx = 0;
        let selectedPackId = null;
        let currentIPFilter = "all";
        let audioCtx = null;

        // 4. 游戏启动挂载钩子
        window.onload = function() {
            initCanvas();
            updateGoldDisplay();
            initAdminRatesForm();
            renderPacksMarket();
            renderWarehouseView();
            buildAdminPackSelector();
            document.getElementById("gmGoldIn").value = gold;
        };

        function updateGoldDisplay() {
            document.getElementById("goldVal").innerText = gold;
            localStorage.setItem("pg_gold_4", gold);
        }

        function saveLocalPackData() {
            localStorage.setItem("pg_packs_4", JSON.stringify(PACKS_CONFIG));
        }

        // 5. 多页面选项卡无缝路由机制切换
        function switchPage(pageId, element) {
            document.querySelectorAll(".game-page").forEach(p => p.style.display = "none");
            document.getElementById("page-" + pageId).style.display = "block";
            document.querySelectorAll(".nav-item").forEach(item => item.classList.remove("active"));
            element.classList.add("active");
            if (pageId === "market") renderPacksMarket();
            if (pageId === "warehouse") renderWarehouseView();
            if (pageId === "admin") buildAdminPackSelector();
        }

        function switchIPFilter(tag, element) {
            currentIPFilter = tag;
            document.querySelectorAll("#ipTabsContainer .tab-btn").forEach(btn => btn.classList.remove("active"));
            element.classList.add("active");
            renderPacksMarket();
        }

        // 6. 潮玩市场渲染器
        function renderPacksMarket() {
            const container = document.getElementById("marketGridContainer");
            container.innerHTML = "";
            const filtered = currentIPFilter === "all" ? PACKS_CONFIG : PACKS_CONFIG.filter(p => p.tag === currentIPFilter);
            
            filtered.forEach(pack => {
                const card = document.createElement("div");
                card.className = "pack-card";
                card.innerHTML = `
                    <img class="pack-banner" src="${pack.banner}" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&q=80'">
                    <div class="pack-info">
                        <div class="pack-title">${pack.title}</div>
                        <div class="pack-cost"><i class="fas fa-coins"></i>${pack.cost} / 单抽</div>
                    </div>
                    <div class="pack-actions">
                        <button class="draw-btn" onclick="executeDrawCore('${pack.id}', 1)">单次开启</button>
                        <button class="draw-btn btn-10" onclick="executeDrawCore('${pack.id}', 10)">尊享十连</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ==================== 💎 核心高可靠纯计算抽卡算法 ====================
        function executeDrawCore(packId, times) {
            selectedPackId = packId;
            const pack = PACKS_CONFIG.find(p => p.id === selectedPackId);
            if (!pack) {
                alert("❌ 系统缺陷：当前未选定有效的抽卡系列！");
                return;
            }

            let totalCost = pack.cost * times;
            if (gold < totalCost) {
                alert("⚠️ 您当前的资本余额不足以进行本次开启！");
                return;
            }

            gold -= totalCost;
            updateGoldDisplay();
            viewQueue = [];

            // 爆率区间递增组合累加
            let bUR = RATES["UR"];
            let bSSR = bUR + RATES["SSR"];
            let bSR = bSSR + RATES["SR"];
            let bR = bSR + RATES["R"];

            for (let i = 0; i < times; i++) {
                let roll = Math.random() * 100;
                let rarity = "N";

                if (roll < bUR) rarity = "UR";
                else if (roll < bSSR) rarity = "SSR";
                else if (roll < bSR) rarity = "SR";
                else if (roll < bR) rarity = "R";

                // 高安全卡池获取
                const currentPack = (typeof PACKS_CONFIG !== 'undefined' && typeof selectedPackId !== 'undefined') ? PACKS_CONFIG.find(p => p.id === selectedPackId) : null;
                let pool = (currentPack && currentPack.pool) ? currentPack.pool : [];
                let filteredPool = pool.filter(m => m.rarity === rarity);
                
                if (filteredPool.length === 0) {
                    filteredPool = pool;
                }

                let rolled = filteredPool[Math.floor(Math.random() * filteredPool.length)];
                if (!rolled) {
                    rolled = { name: "基础纪念章", rarity: "N", image: "" };
                }

                viewQueue.push(rolled);
                warehouse.push({ ...rolled, timestamp: Date.now() + i });
            }

            queueIdx = 0;
            const overlay = document.getElementById("showcardOverlay");
            if (overlay) {
                overlay.style.display = "flex";
                triggerNextQueuedCard();
            }

            localStorage.setItem("pg_warehouse_4", JSON.stringify(warehouse));
        }

        // 7. 二级卡牌展台切卡控制引擎与立绘显示
        function triggerNextQueuedCard() {
            const giantCard = document.getElementById("giantCard");
            const overlay = document.getElementById("showcardOverlay");
            giantCard.classList.remove("pop-up");

            if (queueIdx >= viewQueue.length) {
                overlay.style.display = "none";
                renderWarehouseView();
                return;
            }

            const currentCard = viewQueue[queueIdx];
            const btn = document.getElementById("nextCardBtn");
            btn.innerText = queueIdx === viewQueue.length - 1 ? "全部打包入仓库 💼" : `下一张 (${queueIdx + 1}/${viewQueue.length})`;

            // 渲染数据
            document.getElementById("giantRarity").className = `giant-rarity text-${currentCard.rarity}`;
            document.getElementById("giantRarity").innerText = currentCard.rarity;
            document.getElementById("giantName").innerText = currentCard.name;
            
            const gImg = document.getElementById("giantImg");
            if (currentCard.image) {
                gImg.src = currentCard.image;
                gImg.style.display = "block";
            } else {
                gImg.src = "";
                gImg.style.display = "none";
            }

            // 特效及色彩设置
            giantCard.className = `giant-card border-${currentCard.rarity}`;
            let colorHex = "#fff";
            if (currentCard.rarity === "UR") colorHex = "var(--color-ur)";
            else if (currentCard.rarity === "SSR") colorHex = "var(--color-ssr)";
            else if (currentCard.rarity === "SR") colorHex = "var(--color-sr)";
            else if (currentCard.rarity === "R") colorHex = "var(--color-r)";

            setTimeout(() => {
                giantCard.classList.add("pop-up");
                igniteFXSystem(currentCard.rarity);
                playSoundAudio(currentCard.rarity);
                queueIdx++;
            }, 20);
        }

        // 8. 仓库独立网格动态渲染与精准独立单体回收
        function renderWarehouseView() {
            const container = document.getElementById("warehouseGridContainer");
            if (!container) return;
            container.innerHTML = "";

            const keyword = document.getElementById("globalSearchInput") ? document.getElementById("globalSearchInput").value.trim().toLowerCase() : "";
            let displayList = warehouse;
            if (keyword !== "") {
                displayList = warehouse.filter(item => item.name.toLowerCase().includes(keyword) || item.rarity.toLowerCase().includes(keyword));
            }

            if (displayList.length === 0) {
                container.innerHTML = `<div class="empty-tips">仓库内目前空空如也</div>`;
                return;
            }

            displayList.forEach((item, index) => {
                const price = recoverPrices[item.rarity] !== undefined ? recoverPrices[item.rarity] : 10;
                const node = document.createElement("div");
                node.className = `bag-item border-${item.rarity}`;
                
                const imgSrc = item.image ? item.image : "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150&q=80";
                node.innerHTML = `
                    <img src="${imgSrc}">
                    <div class="bag-name">${item.name}</div>
                    <div class="bag-rarity text-${item.rarity}">${item.rarity}</div>
                    <div class="bag-price"><i class="fas fa-coins"></i>+${price}</div>
                    <button class="recycle-btn" onclick="recycleOneItem(${index})">一键回收</button>
                `;
                container.appendChild(node);
            });
        }

        function recycleOneItem(index) {
            const cardRarity = warehouse[index].rarity;
            const price = recoverPrices[cardRarity] !== undefined ? recoverPrices[cardRarity] : 10;
            gold += price;
            warehouse.splice(index, 1);
            updateGoldDisplay();
            renderWarehouseView();
            localStorage.setItem("pg_warehouse_4", JSON.stringify(warehouse));
        }

        function sellAllWarehouse() {
            if (warehouse.length === 0) return;
            let total = 0;
            warehouse.forEach(item => {
                const price = recoverPrices[item.rarity] !== undefined ? recoverPrices[item.rarity] : 10;
                total += price;
            });
            gold += total;
            warehouse = [];
            updateGoldDisplay();
            renderWarehouseView();
            localStorage.setItem("pg_warehouse_4", JSON.stringify(warehouse));
            alert(`💰 仓库清理成功，按最新折价回笼资产 \$${total} 金币！`);
        }

        // ==================== 🛠️ 可视化管理后台系统 ====================
        function initAdminRatesForm() {
            document.getElementById("rateN").value = RATES["N"];
            document.getElementById("rateR").value = RATES["R"];
            document.getElementById("rateSR").value = RATES["SR"];
            document.getElementById("rateSSR").value = RATES["SSR"];
            document.getElementById("rateUR").value = RATES["UR"];
        }

        function saveCustomRates() {
            let n = Number(document.getElementById("rateN").value);
            let r = Number(document.getElementById("rateR").value);
            let sr = Number(document.getElementById("rateSR").value);
            let ssr = Number(document.getElementById("rateSSR").value);
            let ur = Number(document.getElementById("rateUR").value);

            if (Math.abs((n + r + sr + ssr + ur) - 100) > 0.01) {
                alert("❌ 保存失败：五项配置合计不等于100%，请修正！");
                return;
            }

            RATES["N"] = n; RATES["R"] = r; RATES["SR"] = sr; RATES["SSR"] = ssr; RATES["UR"] = ur;
            alert("🎯 该卡包配置/时间已热更新完成，即时生效！");
        }

        function saveGmGold() {
            const val = parseInt(document.getElementById("gmGoldIn").value);
            if (!isNaN(val)) {
                gold = val;
                updateGoldDisplay();
                alert("🪙 资产充值修改成功！");
            }
        }

        function buildAdminPackSelector() {
            const select = document.getElementById("adminPackSelect");
            select.innerHTML = "";
            PACKS_CONFIG.forEach(p => {
                const opt = document.createElement("option");
                opt.value = p.id;
                opt.innerText = p.title;
                select.appendChild(opt);
            });
            loadPackToAdminForm();
        }

        function loadPackToAdminForm() {
            const packId = document.getElementById("adminPackSelect").value;
            const pack = PACKS_CONFIG.find(p => p.id === packId);
            if (!pack) return;

            document.getElementById("adminPackTitle").value = pack.title;
            document.getElementById("adminPackBanner").value = pack.banner;
            document.getElementById("adminPackCost").value = pack.cost;
            refreshAdminPoolPreview(pack);
        }

        function refreshAdminPoolPreview(pack) {
            const container = document.getElementById("adminPoolPreview");
            container.innerHTML = "";
            pack.pool.forEach(c => {
                const div = document.createElement("div");
                div.style.padding = "4px 8px";
                div.style.background = "#2d3748";
                div.style.borderRadius = "4px";
                div.style.fontSize = "11px";
                div.innerHTML = `${c.name} <span class="text-${c.rarity}">[${c.rarity}]</span>`;
                container.appendChild(div);
            });
        }

        function savePackBasicConfig() {
            const packId = document.getElementById("adminPackSelect").value;
            const pack = PACKS_CONFIG.find(p => p.id === packId);
            if (!pack) return;

            pack.title = document.getElementById("adminPackTitle").value.trim();
            pack.banner = document.getElementById("adminPackBanner").value.trim();
            pack.cost = parseInt(document.getElementById("adminPackCost").value) || 100;
            
            saveLocalPackData();
            alert("✨ 卡包基本参数修改完成！");
        }

        function addNewCardToPool() {
            const packId = document.getElementById("adminPackSelect").value;
            const pack = PACKS_CONFIG.find(p => p.id === packId);
            if (!pack) return;

            const name = document.getElementById("newCardName").value.trim();
            const rarity = document.getElementById("newCardRarity").value;
            const image = document.getElementById("newCardImage").value.trim();

            if (!name) {
                alert("⚠️ 请完整填写卡片名称及图片路径！");
                return;
            }

            pack.pool.push({ name, rarity, image });
            saveLocalPackData();
            refreshAdminPoolPreview(pack);
            
            document.getElementById("newCardName").value = "";
            document.getElementById("newCardImage").value = "";
            alert(`🎉 成功将新卡【${name}】注入到随机抽奖池中！`);
        }

        // ==================== 🔊 Web Audio 音效系统引擎 ====================
        function playSoundAudio(rarity) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === "suspended") {
                    audioCtx.resume();
                }
                const now = audioCtx.currentTime;
                if (rarity === 'N' || rarity === 'R') {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine'; osc.frequency.setValueAtTime(587.33, now);
                    gain.gain.exponentialRampToValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0.001, now + 0.12);
                    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.12);
                } else if (rarity === 'SR') {
                    triggerChord([440.00, 554.37, 659.25], 0.3, 'triangle');
                } else if (rarity === 'SSR') {
                    triggerChord([523.25, 659.25, 783.99, 1046.50], 0.6, 'sawtooth');
                } else if (rarity === 'UR') {
                    triggerChord([220.30, 329.63, 392.40, 440.00, 554.37], 1.0, 'sawtooth');
                }
            } catch (e) { console.log(e); }
        }

        function triggerChord(freqs, duration, waveType) {
            const now = audioCtx.currentTime;
            freqs.forEach(f => {
                let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
                osc.type = waveType; osc.frequency.setValueAtTime(f, now);
                gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + duration);
            });
        }

        // ==================== 🎆 Canvas 喷射粒子特效引擎 ====================
        let canvas, ctx, particles = [], fxAnimationId;
        function initCanvas() {
            canvas = document.getElementById("fxCanvas");
            ctx = canvas.getContext("2d");
            window.addEventListener("resize", resizeCanvas);
            resizeCanvas();
        }
        function resizeCanvas() {
            if(canvas) { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        }
        function igniteFXSystem(rarity) {
            cancelAnimationFrame(fxAnimationId);
            particles = [];
            if (rarity === "N" || rarity === "R") {
                document.getElementById("fxCanvas").style.display = "none";
                return;
            }
            document.getElementById("fxCanvas").style.display = "block";
            let colors = rarity === "SSR" ? ["#ffd700", "#ff8c00", "#ffffff"] : ["#ff4444", "#dc2626", "#ffd700"];
            if (rarity === "SR") colors = ["#a020f0", "#a855f7", "#ffffff"];
            
            let count = rarity === "UR" ? 140 : 70;
            const startX = window.innerWidth / 2;
            const startY = window.innerHeight * 0.45;
            
            for (let i = 0; i < count; i++) {
                let p = (rarity === "UR") ? 7 : 4;
                particles.push({
                    x: startX, y: startY,
                    vx: (Math.random() - 0.5) * p, vy: (Math.random() - 0.6) * p - 2,
                    alpha: 1, decay: Math.random() * 0.015 + 0.01,
                    size: Math.random() * 4 + 2, color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
            runFXLoop();
        }
        function runFXLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;
            particles.forEach(p => {
                if (p.alpha > 0) {
                    active = true; p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.alpha -= p.decay;
                    ctx.save(); ctx.globalAlpha = p.alpha; ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.fill(); ctx.restore();
                }
            });
            if (active) fxAnimationId = requestAnimationFrame(runFXLoop);
            else document.getElementById("fxCanvas").style.display = "none";
        }
    </script>
