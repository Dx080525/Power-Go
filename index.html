<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌟 Power Go Premium 🌟</title>
    <style>
        /* ==================== 👑 全局变量与手机端适配重构 👑 ==================== */
        :root {
            --bg-main: #0f111a;
            --bg-card: #1a1c29;
            --primary: #26e6e6;
            --color-n: #94a3b8;
            --color-r: #3b82f6;
            --color-sr: #a855f7;
            --color-ssr: #fbbf24;
            --color-ur: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: white;
            padding-bottom: 70px; /* 为底部导航栏留空 */
            overflow-x: hidden;
        }

        /* 顶部通栏 */
        .header-bar {
            background: #161925;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #232838;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-title {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(38,230,230,0.3);
        }

        .gold-badge {
            background: linear-gradient(135deg, #ffd700, #b48a00);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 3px 10px rgba(180,138,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 主体内容视图区 */
        .view-section {
            display: none;
            padding: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        .view-section.active {
            display: block;
        }

        /* ==================== 🎴 抽玩/卡包大厅样式 ==================== */
        .pack-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .pack-grid { grid-template-columns: 1fr; }
        }

        .pack-card {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid #2a2e45;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .pack-card:active { transform: scale(0.98); }

        .pack-banner {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: linear-gradient(45deg, #1e1b4b, #311042);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .pack-info {
            padding: 15px;
        }

        .pack-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .pack-price {
            color: #ffd700;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .draw-btn-row {
            display: flex;
            gap: 8px;
        }

        .draw-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-blue { background: linear-gradient(180deg, #0284c7, #0369a1); }
        .btn-orange { background: linear-gradient(180deg, #f97316, #ea580c); }

        /* 概率公示板 */
        .rate-board {
            background: #161925;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 12px;
            line-height: 1.6;
            color: #94a3b8;
            border: 1px solid #232838;
        }

        /* 本轮清单流水线 */
        .flow-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        /* ==================== 🎒 核心智能仓库样式 ==================== */
        .warehouse-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .clear-btn {
            background: linear-gradient(135deg, #f43f5e, #be123c);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }

        .warehouse-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        @media (min-width: 600px) {
            .warehouse-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .bag-item {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #282d42;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .bag-item-img {
            width: 100%;
            height: 140px;
            object-fit: contain;
            border-radius: 8px;
            background: #0b0d14;
            padding: 5px;
        }

        .bag-item-name {
            font-size: 14px;
            font-weight: bold;
            margin-top: 8px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .bag-item-rarity {
            font-size: 11px;
            font-weight: 900;
            margin: 2px 0 8px 0;
            font-style: italic;
        }

        .cell-action-btn {
            width: 100%;
            padding: 6px;
            border: none;
            border-radius: 6px;
            background: #334155;
            color: #f1f5f9;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .cell-action-btn:hover { background: #475569; }

        /* 稀有度专属璀璨边框类 */
        .border-N { border-color: var(--color-n); }
        .border-R { border-color: var(--color-r); box-shadow: 0 0 8px rgba(59,130,246,0.2); }
        .border-SR { border-color: var(--color-sr); box-shadow: 0 0 12px rgba(168,85,247,0.4); }
        .border-SSR { border-color: var(--color-ssr); box-shadow: 0 0 16px rgba(251,191,36,0.6); }
        .border-UR { border-color: var(--color-ur); box-shadow: 0 0 20px rgba(239,68,68,0.8); animation: pulseUR 1.5s infinite alternate; }

        @keyframes pulseUR {
            0% { transform: scale(1); }
            100% { transform: scale(1.01); filter: brightness(1.1); }
        }

        /* ==================== 📱 底部大厂App极简黑胶导航栏 ==================== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #11131e;
            border-top: 1px solid #222638;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #64748b;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            flex: 1;
            padding: 8px 0;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 3px;
        }

        /* ==================== 🎆 粒子特效全屏喷射大层 ==================== */
        #fxCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 99998;
            pointer-events: none;
            display: none;
        }

        /* 全屏抽卡高透弹窗 */
        #showcardOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 12, 0.96);
            z-index: 99990;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .giant-card {
            width: 85vw;
            max-width: 300px;
            height: 120vw;
            max-height: 430px;
            background: #191c2b;
            border-radius: 18px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            border: 3px solid #3b4261;
            transform: scale(0.7);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .giant-card.pop-up { transform: scale(1); opacity: 1; }

        .giant-rarity { font-size: 28px; font-weight: 900; font-style: italic; align-self: flex-start; }
        .giant-card img { width: 100%; height: 75%; object-fit: contain; border-radius: 10px; background: #0c0e17; padding: 4px; }
        .giant-name { font-size: 18px; font-weight: bold; text-align: center; }

        .next-btn {
            margin-top: 25px;
            padding: 12px 35px;
            font-size: 15px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(34,197,94,0.4);
        }

        /* 隐藏的GM面板 */
        .gm-panel-sec { background: #161925; padding: 15px; border-radius: 12px; margin-top: 20px; border: 1px dashed var(--color-sr); }
        .empty-tip { color: #475569; text-align: center; font-style: italic; padding: 30px; width: 100%; }
        
        /* 手机端全屏震动 */
        .shake-body { animation: bodyShake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes bodyShake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
            40%, 60% { transform: translate3d(3px, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="brand-title">POWER GO</div>
        <div class="gold-badge">🪙 <span id="goldVal">5000</span></div>
    </div>

    <div id="view-home" class="view-section active">
        <div class="rate-board">
            📌 <strong>全局官方爆率宏控调配公示：</strong><br>
            N级: 80% | R级: 12% | SR级: 5% | SSR级: 2.8% | UR级: 0.2%
        </div>
        
        <h2>🔥 热门推荐卡包</h2>
        <div id="packGridContainer" class="pack-grid"></div>

        <h3 style="margin-top:25px; color:#94a3b8;">📋 本轮欧气开出清单</h3>
        <div id="flowResultGrid" class="pack-grid" style="margin-top:10px;">
            <div class="empty-tip">暂无抽卡流流水纪录</div>
        </div>
    </div>

    <div id="view-bag" class="view-section">
        <div class="warehouse-header">
            <h2>🎒 我的核心个人仓库</h2>
            <button class="clear-btn" onclick="sellAllWarehouse()">一键清空回收</button>
        </div>
        <div id="warehouseGridContainer" class="warehouse-grid">
            <div class="empty-tip">仓库空空如也，快去大厅抽卡！</div>
        </div>
    </div>

    <div id="view-gm" class="view-section">
        <h2>🛠️ GM 级高级内核调配室</h2>
        <div class="gm-panel-sec">
            <p style="color:#a855f7; margin-bottom:10px; font-weight:bold;">🪙 快捷篡改核心资产账户</p>
            <input type="number" id="gmGoldIn" style="background:#000; border:1px solid #444; color:#26e6e6; padding:8px; border-radius:6px; width:120px; font-weight:bold; font-size:16px;">
            <button onclick="saveGmGold()" style="background:var(--color-sr); color:#fff; border:none; padding:8px 15px; border-radius:6px; font-weight:bold; margin-left:10px;">瞬时注资</button>
        </div>
        <p style="font-size:11px; color:#475569; text-align:center; margin-top:20px;">Power Go Engine v2.5 移动端适配大厂架构</p>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <div class="nav-icon">⚡</div>
            <div>潮玩</div>
        </div>
        <div class="nav-item" onclick="switchTab('bag', this)">
            <div class="nav-icon">🎒</div>
            <div>仓库</div>
        </div>
        <div class="nav-item" onclick="switchTab('gm', this)">
            <div class="nav-icon">⚙️</div>
            <div>高级配置</div>
        </div>
    </div>

    <canvas id="fxCanvas"></canvas>

    <div id="showcardOverlay">
        <div id="giantCard" class="giant-card"></div>
        <button id="nextCardBtn" class="next-btn" onclick="triggerNextQueuedCard()">下一张 ➡️</button>
    </div>

<script>
    // ==================== 📦 卡包多数据源矩阵重构 ====================
    const PACKS_CONFIG = [
        {
            id: "pack_01",
            title: "精灵觉醒系列 (第一弹)",
            emoji: "🐲",
            cost: 100,
            // 包含原本完整的30只精灵池
            pool: [
                { name: "妙蛙种子", rarity: "N", image: "https://asia.pokemon-card.com/tw/card-img/tw00013958.png" },
                { name: "小火龙", rarity: "N", image: "https://asia.pokemon-card.com/tw/card-img/tw00014329.png" },
                { name: "杰尼龟", rarity: "N", image: "https://asia.pokemon-card.com/hk/card-img/hk00007276.png" },
                { name: "绿毛虫", rarity: "N", image: "https://asia.pokemon-card.com/tw/card-img/tw00005631.png" },
                { name: "波波", rarity: "N", image: "https://asia.pokemon-card.com/tw/card-img/tw00009333.png" },
                { name: "可达鸭", rarity: "N", image: "https://asia.pokemon-card.com/tw/card-img/tw00012680.png" },
                { name: "呆呆兽", rarity: "N", image: "https://asia.pokemon-card.com/tw/card-img/tw00019172.png" },
                { name: "小磁怪", rarity: "N", image: "https://asia.pokemon-card.com/tw/card-img/tw00016702.png" },
                { name: "地鼠", rarity: "N", image: "https://asia.pokemon-card.com/tw/card-img/tw00014742.png" },
                { name: "比雕 (大比鸟)", rarity: "R", image: "https://asia.pokemon-card.com/tw/card-img/tw00008572.png" },
                { name: "大针蜂", rarity: "R", image: "https://asia.pokemon-card.com/tw/card-img/tw00018423.png" },
                { name: "胖丁", rarity: "R", image: "https://asia.pokemon-card.com/tw/card-img/tw00014382.png" },
                { name: "九尾", rarity: "R", image: "https://asia.pokemon-card.com/tw/card-img/tw00011096.png" },
                { name: "风速狗", rarity: "R", image: "https://asia.pokemon-card.com/hk/card-img/hk00008386.png" },
                { name: "耿鬼", rarity: "R", image: "https://asia.pokemon-card.com/tw/card-img/tw00009817.png" },
                { name: "暴鲤龙", rarity: "R", image: "https://asia.pokemon-card.com/tw/card-img/tw00018021.png" },
                { name: "卡比兽", rarity: "R", image: "https://asia.pokemon-card.com/tw/card-img/tw00017040.png" },
                { name: "快龙 ex", rarity: "SR", image: "https://asia.pokemon-card.com/tw/card-img/tw00015998.png" },
                { name: "巨金怪 ex", rarity: "SR", image: "https://asia.pokemon-card.com/tw/card-img/tw00012588.png" },
                { name: "轰鸣月 ex", rarity: "SR", image: "https://asia.pokemon-card.com/tw/card-img/tw00011625.png" },
                { name: "铁武者 ex", rarity: "SR", image: "https://asia.pokemon-card.com/hk/card-img/hk00010062.png" },
                { name: "班基拉斯 ex", rarity: "SR", image: "https://asia.pokemon-card.com/tw/card-img/tw00012148.png" },
                { name: "赛富豪 ex", rarity: "SR", image: "https://asia.pokemon-card.com/hk/card-img/hk00009895.png" },
                { name: "喷火龙 ex", rarity: "SSR", image: "https://asia.pokemon-card.com/tw/card-img/tw00016556.png" },
                { name: "皮卡丘 ex", rarity: "SSR", image: "https://asia.pokemon-card.com/tw/card-img/tw00011485.png" },
                { name: "甲贺忍蛙 ex", rarity: "SSR", image: "https://asia.pokemon-card.com/tw/card-img/tw00010723.png" },
                { name: "超梦 ex", rarity: "SSR", image: "https://asia.pokemon-card.com/tw/card-img/tw00016761.png" },
                { name: "烈空坐", rarity: "SSR", image: "https://asia.pokemon-card.com/hk/card-img/hk00001123.png" },
                { name: "金色·阿尔宙斯 VSTAR", rarity: "UR", image: "https://p2.bahamut.com.tw/B/2KU/48/6bae19cfa9c1cb5ba1b9f5ea611tayo5.PNG" },
                { name: "金色·骑拉帝纳 VSTAR", rarity: "UR", image: "https://asia.pokemon-card.com/hk/card-img/hk00008066.png" }
            ]
        }
        // 💡 提示：后续需要加第二个、第三个卡包时，只需要在大括号后面加逗号，然后粘贴全新数组即可扩展！
    ];

    // 固定爆率分配结构
    const RATES = { "UR": 0.2, "SSR": 2.8, "SR": 5.0, "R": 12.0, "N": 80.0 };
    const RECOVER_PRICES = { "N": 10, "R": 80, "SR": 800, "SSR": 3500, "UR": 9999 };

    // 核心引擎状态追踪
    let gold = localStorage.getItem("pg_gold") !== null ? parseInt(localStorage.getItem("pg_gold")) : 5000;
    let warehouse = localStorage.getItem("pg_inventory") !== null ? JSON.parse(localStorage.getItem("pg_inventory")) : [];
    let currentDrawResults = [];
    let viewQueue = [];
    let queueIdx = 0;

    // Audio合成器单例缓存
    let audioCtx = null;

    window.onload = function() {
        initCanvas();
        updateGoldDisplay();
        renderPacksMarket();
        renderWarehouseView();
        document.getElementById("gmGoldIn").value = gold;
    };

    function updateGoldDisplay() {
        document.getElementById("goldVal").innerText = gold;
        localStorage.setItem("pg_gold", gold);
    }

    // ==================== 📱 仿原生App单页切签架构 ====================
    function switchTab(targetId, el) {
        document.querySelectorAll(".view-section").forEach(sec => sec.classList.remove("active"));
        document.querySelectorAll(".nav-item").forEach(item => item.classList.remove("active"));
        
        document.getElementById("view-" + targetId).classList.add("active");
        el.classList.add("active");
        window.scrollTo(0,0);
    }

    // 绘制大厅里的卡包
    function renderPacksMarket() {
        const grid = document.getElementById("packGridContainer");
        grid.innerHTML = "";
        PACKS_CONFIG.forEach(pack => {
            const card = document.createElement("div");
            card.className = "pack-card";
            card.innerHTML = `
                <div class="pack-banner">${pack.emoji}</div>
                <div class="pack-info">
                    <div class="pack-name">${pack.title}</div>
                    <div class="pack-price">🪙 ${pack.cost} 金币 / 单抽</div>
                    <div class="draw-btn-row">
                        <button class="draw-btn btn-blue" onclick="executeDrawCore('${pack.id}', 1)">单抽</button>
                        <button class="draw-btn btn-orange" onclick="executeDrawCore('${pack.id}', 10)">十连抽</button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // ==================== 🎲 大厂高拟真高级抽卡算法内核 ====================
    function executeDrawCore(packId, times) {
        const targetPack = PACKS_CONFIG.find(p => p.id === packId);
        const totalCost = targetPack.cost * times;

        if (gold < totalCost) {
            alert("🪙 资产储备不足！请先去个人仓库回收旧卡换取注资。");
            return;
        }

        gold -= totalCost;
        updateGoldDisplay();

        currentDrawResults = [];
        viewQueue = [];

        // 边界断点精确计算
        let bUR = RATES["UR"];
        let bSSR = bUR + RATES["SSR"];
        let bSR = bSSR + RATES["SR"];
        let bR = bSR + RATES["R"];

        for (let i = 0; i < times; i++) {
            let roll = Math.random() * 100;
            let rarity = "N";

            if (roll < bUR) rarity = "UR";
            else if (roll < bSSR) rarity = "SSR";
            else if (roll < bSR) rarity = "SR";
            else if (roll < bR) rarity = "R";

            let filteredPool = targetPack.pool.filter(m => m.rarity === rarity);
            // 如果某包中没有配对级别的卡牌，自动降级安全保护
            if(filteredPool.length === 0) {
                filteredPool = targetPack.pool.filter(m => m.rarity === "N");
            }
            let rolled = filteredPool[Math.floor(Math.random() * filteredPool.length)];

            currentDrawResults.push(rolled);
            viewQueue.push(rolled);
            warehouse.push({ ...rolled, sellPrice: RECOVER_PRICES[rolled.rarity] });
        }

        queueIdx = 0;
        document.getElementById("showcardOverlay").style.display = "flex";
        triggerNextQueuedCard();
    }

    // 弹窗轮播展台
    function triggerNextQueuedCard() {
        const giantCard = document.getElementById("giantCard");
        const overlay = document.getElementById("showcardOverlay");

        giantCard.classList.remove("pop-up");

        if (queueIdx >= viewQueue.length) {
            overlay.style.display = "none";
            flushFlowResultsGrid();
            renderWarehouseView();
            localStorage.setItem("pg_inventory", JSON.stringify(warehouse));
            return;
        }

        const currentCard = viewQueue[queueIdx];
        const btn = document.getElementById("nextCardBtn");

        btn.innerText = queueIdx === viewQueue.length - 1 ? "收入核心仓库 🎒" : `下一张 (${queueIdx + 1}/${viewQueue.length}) ➡️`;

        setTimeout(() => {
            giantCard.className = `giant-card border-${currentCard.rarity}`;
            
            let colorHex = "#fff";
            if(currentCard.rarity === 'UR') colorHex = "var(--color-ur)";
            else if(currentCard.rarity === 'SSR') colorHex = "var(--color-ssr)";
            else if(currentCard.rarity === 'SR') colorHex = "var(--color-sr)";

            giantCard.innerHTML = `
                <div class="giant-rarity" style="color:${colorHex}">${currentCard.rarity}</div>
                <img src="${currentCard.image}">
                <div class="giant-name">${currentCard.name}</div>
            `;

            giantCard.classList.add("pop-up");
            queueIdx++;

            // 触发全新重构的声光喷射特效体系
            igniteFXSystem(currentCard.rarity);

        }, 120);
    }

    // 本轮流水渲染
    function flushFlowResultsGrid() {
        const grid = document.getElementById("flowResultGrid");
        grid.innerHTML = "";
        currentDrawResults.forEach(m => {
            const node = document.createElement("div");
            node.className = `bag-item border-${m.rarity}`;
            node.innerHTML = `
                <img class="bag-item-img" src="${m.image}">
                <div class="bag-item-name">${m.name}</div>
                <div class="bag-item-rarity" style="color:var(--color-${m.rarity.toLowerCase()})">${m.rarity}</div>
            `;
            grid.appendChild(node);
        });
    }

    // ==================== 🎒 核心个人仓库系统逻辑 ====================
    function renderWarehouseView() {
        const container = document.getElementById("warehouseGridContainer");
        if (warehouse.length === 0) {
            container.innerHTML = `<div class="empty-tip">仓库空空如也，快去大厅抽卡！</div>`;
            return;
        }
        container.innerHTML = "";
        warehouse.forEach((m, idx) => {
            const node = document.createElement("div");
            node.className = `bag-item border-${m.rarity}`;
            node.innerHTML = `
                <img class="bag-item-img" src="${m.image}">
                <div class="bag-item-name">${m.name}</div>
                <div class="bag-item-rarity" style="color:var(--color-${m.rarity.toLowerCase()})">${m.rarity}</div>
                <button class="cell-action-btn" onclick="recycleOneItem(${idx})">回收 +${m.sellPrice}</button>
            `;
            container.appendChild(node);
        });
    }

    function recycleOneItem(index) {
        gold += warehouse[index].sellPrice;
        warehouse.splice(index, 1);
        updateGoldDisplay();
        renderWarehouseView();
        localStorage.setItem("pg_inventory", JSON.stringify(warehouse));
    }

    function sellAllWarehouse() {
        if (warehouse.length === 0) return;
        let total = 0;
        warehouse.forEach(item => total += item.sellPrice);
        gold += total;
        warehouse = [];
        updateGoldDisplay();
        renderWarehouseView();
        localStorage.setItem("pg_inventory", JSON.stringify(warehouse));
        alert(`💰 一键清算回收成功！已成功回笼变现资金 ${total} 金币！`);
    }

    function saveGmGold() {
        gold = parseInt(document.getElementById("gmGoldIn").value) || 0;
        updateGoldDisplay();
        alert("🎯 GM数据包已瞬间完成物理覆盖修正！");
    }

    // ==================== 🔊 Web Audio API 无声源超拟真合成乐系统 ====================
    function playSynthAudio(type) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;
            
            if (type === 'N' || type === 'R') {
                // 普通卡：清脆机械音
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.15);
            } 
            else if (type === 'SR') {
                // 紫光高亢和弦
                triggerChord([440, 554.37, 659.25], 0.3, 'triangle');
            } 
            else if (type === 'SSR') {
                // 金光闪耀史诗级上升音
                triggerChord([523.25, 659.25, 783.99, 1046.50], 0.5, 'sawtooth');
            } 
            else if (type === 'UR') {
                // UR 黑暗深邃神话级多频交响乐
                triggerChord([220, 329.63, 392, 440, 554.37], 0.8, 'sawtooth');
                setTimeout(() => triggerChord([440, 554.37, 659.25, 880], 1.2, 'sine'), 200);
            }
        } catch (e) { console.log("音频引擎初始化延迟中", e); }
    }

    function triggerChord(freqs, duration, waveType) {
        const now = audioCtx.currentTime;
        freqs.forEach(f => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = waveType;
            osc.frequency.setValueAtTime(f, now);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + duration);
        });
    }

    // ==================== 🎆 Canvas 全屏流体喷射粒子引擎 ====================
    let canvas, ctx;
    let particles = [];
    let fxAnimationId;

    function initCanvas() {
        canvas = document.getElementById("fxCanvas");
        ctx = canvas.getContext("2d");
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();
    }

    function resizeCanvas() {
        if(canvas) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
    }

    function igniteFXSystem(rarity) {
        // 先停掉上一轮
        cancelAnimationFrame(fxAnimationId);
        particles = [];
        
        // 触发音效
        playSynthAudio(rarity);

        if (rarity === "N" || rarity === "R") {
            document.getElementById("fxCanvas").style.display = "none";
            return;
        }

        // 手机物理震动体感模拟
        document.body.classList.remove("shake-body");
        if(rarity === "UR") {
            setTimeout(() => document.body.classList.add("shake-body"), 5);
            setTimeout(() => document.body.classList.remove("shake-body"), 400);
        }

        document.getElementById("fxCanvas").style.display = "block";
        
        let colors = [];
        // 根据稀有度设定粒子颜色池
        if(rarity === "SR") colors = ["#c084fc", "#a855f7", "#e9d5ff", "#ffffff"]; // 紫光
        if(rarity === "SSR") colors = ["#fbbf24", "#f59e0b", "#fef08a", "#ffffff"]; // 金光
        if(rarity === "UR") colors = ["#ef4444", "#dc2626", "#7f1d1d", "#000000"]; // 寂灭高级红黑光

        const spawnX = window.innerWidth / 2;
        const spawnY = window.innerHeight * 0.45; // 从卡牌中心喷射

        // 喷射粒子生成数
        let particleCount = rarity === "UR" ? 180 : (rarity === "SSR" ? 120 : 60);

        for(let i=0; i<particleCount; i++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 8 + (rarity === "UR" ? 6 : 4);
            particles.push({
                x: spawnX,
                y: spawnY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 2, // 略微向上带一点喷射力
                radius: Math.random() * 4 + 2,
                color: colors[Math.floor(Math.random() * colors.length)],
                alpha: 1,
                decay: Math.random() * 0.02 + 0.015
            });
        }

        runFXLoop();
    }

    function runFXLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let activeParticles = false;

        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.1; // 重力加速度
            p.alpha -= p.decay;

            if(p.alpha > 0) {
                activeParticles = true;
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                // 为高级卡加入光晕阴影
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.fill();
                ctx.restore();
            }
        });

        if(activeParticles) {
            fxAnimationId = requestAnimationFrame(runFXLoop);
        } else {
            document.getElementById("fxCanvas").style.display = "none";
        }
    }
</script>
